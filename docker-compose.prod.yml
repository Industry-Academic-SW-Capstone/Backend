# EC2 한 대(메모리 2GB + 스왑) 배포 구성: Traefik + PostgreSQL(pgvector) + 백엔드 + AI 서버.
# 값은 같은 디렉터리의 .env 에서 읽는다(.env.prod.example 참고).
# 메모리 상한 합계 약 1.7GB — 나머지는 OS 몫이고, 순간 초과는 스왑이 받는다.
services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/letsencrypt:/etc/traefik/letsencrypt
    networks:
      - backend
    mem_limit: 96m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 뉴스 RAG 용 stock_news DB 계정(postgres/init/10-news-db.sh). 첫 기동에만 쓰인다.
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # 호스트로 포트를 열지 않는다. 접속은 컨테이너 네트워크 안에서만.
    command:
      - postgres
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    mem_limit: 384m
    logging: *logging

  backend:
    image: ${DOCKER_USERNAME}/stockit:${BACKEND_TAG:-toss}
    container_name: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHON_ANALYSIS_URL: http://ai:8000
      KIS_API_APPKEY: ${KIS_API_APPKEY}
      KIS_API_APPSECRET: ${KIS_API_APPSECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      # 미설정 시 기동에 실패한다(fail-fast).
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      # 빈 DB 에 처음 올릴 때 한 번 true 로 두면 KIS 종목 마스터를 받아 온다.
      APP_RUN_MASTER_UPDATE_ON_STARTUP: ${APP_RUN_MASTER_UPDATE_ON_STARTUP:-false}
      # 상한 896MB 중 힙 약 490MB. 나머지는 메타스페이스·스레드 스택·코드 캐시 몫이다.
      JAVA_OPTS: >-
        -XX:+UseContainerSupport -XX:MaxRAMPercentage=55.0 -XX:MaxMetaspaceSize=192m -Xss512k
        -XX:+UseG1GC -XX:+UseStringDeduplication -Duser.timezone=Asia/Seoul
      SERVER_TOMCAT_THREADS_MAX: 50
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
    # Traefik 은 healthy 가 된 컨테이너에만 보낸다. Dockerfile 기본(30초 간격)이면 배포마다 약 40초 404 가 난다.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.routers.api.middlewares=security-headers
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
    networks:
      - backend
    mem_limit: 896m
    logging:
      <<: *logging
      options:
        max-size: "20m"
        max-file: "5"

  ai:
    image: ${DOCKER_USERNAME}/stockit-ai:${AI_TAG:-toss}
    container_name: ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 외부로 열지 않는다. 백엔드만 http://ai:8000 으로 부른다.
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      PGVECTOR_HOST: db
      PGVECTOR_PORT: 5432
      PGVECTOR_USER: stockai
      PGVECTOR_PASSWORD: ${NEWS_DB_PASSWORD}
      PGVECTOR_DB: stock_news
    networks:
      - backend
    mem_limit: 320m
    logging: *logging

volumes:
  postgres_data:

networks:
  backend:
    name: backend
