# 테스트 환경 전용 설정 파일
spring:
  # Redis 설정을 'localhost'로 덮어쓴다
  data:
    redis:
      host: localhost
      port: 6379

  # DB(Postgres) 설정을 'localhost'로 덮어쓴다
  datasource:
    url: jdbc:postgresql://localhost:5432/database
    username: sa
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50  # 동시성 테스트를 위한 커넥션 풀 크기 증가
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        transaction:
          timeout: 30  # 트랜잭션 타임아웃 (초)

  # 테스트 환경에서 스케줄러 비활성화 (백그라운드 작업 방지)
  task:
    scheduling:
      enabled: false

kis:
  api:
    url: "https://openapivts.koreainvestment.com:29443"
    appkey: ${KIS_API_APPKEY:test_appkey}
    appsecret: ${KIS_API_APPSECRET:test_appsecret}

# Python 서버 설정 (테스트 환경)
python:
  analysis:
    url: ${PYTHON_ANALYSIS_URL:http://localhost:8000}
    # 또는 배포 서버 고정: http://34.64.175.176

# JWT 설정 (테스트 환경)
jwt:
  secret: ${JWT_SECRET:testSecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}