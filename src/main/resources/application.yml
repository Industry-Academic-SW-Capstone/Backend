spring:
  application:
    name: stockIt
  # 프로필: 하나만 지정 (local / dev / prod). 미지정 시 local
  # 예: -Dspring.profiles.active=local 또는 환경변수 SPRING_PROFILES_ACTIVE=local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # Flyway 설정 (FlywayConfig에서 수동 초기화하므로 자동 실행 비활성화)
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    init-sqls: []

server:
  tomcat:
    mbeanregistry:
      # 톰캣 스레드 지표(tomcat_threads_*)는 MBean 등록을 켜야 노출된다.
      # 스레드 사용량을 상한(max-threads)과 함께 봐야 고갈 여부를 판단할 수 있다.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/**는 인증 없이 열려 있다(프로메테우스 스크레이프). env·configprops는
        # 값이 마스킹되더라도 설정 키 전체를 드러내므로 노출하지 않는다.
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      # /actuator/**는 인증 없이 열려 있고 8080이 호스트에 퍼블리시된다. always면 DB·Redis
      # 컴포넌트 상태와 디스크 여유 용량이 무인증으로 노출된다.
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.memory.used: true
        process.cpu.usage: true
        # 커넥션을 기다린 시간(acquire)과 쥐고 있던 시간(usage).
        # 둘을 나눠 봐야 풀이 작아서 막힌 것인지, 한 번 잡은 커넥션을 오래 쥐어서 막힌 것인지 갈린다.
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
      # 버킷 범위를 커넥션 타임아웃과 맞춘다. 기본값은 범위가 넓어 버킷만 늘어난다.
      minimum-expected-value:
        hikaricp.connections.acquire: 1ms
        hikaricp.connections.usage: 1ms
      maximum-expected-value:
        hikaricp.connections.acquire: 30s
        hikaricp.connections.usage: 30s
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        jvm.memory.used: 0.5,0.95,0.99
        process.cpu.usage: 0.5,0.95,0.99

# KIS API 설정
kis:
  api:
    # KIS API 호출 속도 제한(초당). KIS가 초당 30건을 막으므로 여유를 둔 값이다.
    # 랭킹 배치가 캐시 미스 종목을 이 속도로 순차 조회한다.
    rate-limit-per-second: ${KIS_API_RATE_LIMIT_PER_SECOND:25.0}
    url: "https://openapi.koreainvestment.com:9443"
    appkey: ${KIS_API_APPKEY}
    appsecret: ${KIS_API_APPSECRET}
  api-app-key: ${KIS_API_APPKEY:}

# Python 분석 서버 설정
python:
  analysis:
    url: ${PYTHON_ANALYSIS_URL}

# Gemini API 설정
gemini:
  api:
    api-key: ${GEMINI_API_KEY}
    model-name: ${GEMINI_API_MODEL_NAME:models/gemini-2.5-flash}
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  admin-key: ${KAKAO_ADMIN_KEY:}

# Firebase 설정
firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    # allowCredentials(true)와 와일드카드 오리진은 함께 쓸 수 없다 — 도메인을 명시한다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  admin:
    # 관리자 API(/api/admin/**, /api/batch-jobs/**) 허용 이메일. 쉼표로 구분한다.
    # 비어 있으면 아무도 통과하지 못한다(fail-closed).
    emails: ${APP_ADMIN_EMAILS:}

# 지정가 매칭 엔진
matching:
  # 체결 이벤트 1건이 훑을 오더북 후보 최대 개수. 임계 구역 길이에 직접 영향을 준다.
  limit-order-fetch-size: ${MATCHING_LIMIT_ORDER_FETCH_SIZE:100}
  lock:
    # 종목 락 대기 상한. advisory 락은 기본이 무한 대기라 반드시 걸어야 한다.
    # 초과하면 예외로 떨어지고 matching.lock.timeouts 로 집계된다.
    timeout: ${MATCHING_LOCK_TIMEOUT:10s}
