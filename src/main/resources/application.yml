spring:
  application:
    name: stockIt
  # 프로필: 하나만 지정 (local / dev / prod). 미지정 시 local
  # 예: -Dspring.profiles.active=local 또는 환경변수 SPRING_PROFILES_ACTIVE=local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

  # Flyway 설정 (FlywayConfig에서 수동 초기화하므로 자동 실행 비활성화)
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    init-sqls: []

management:
  endpoints:
    web:
      exposure:
        # /actuator/**는 인증 없이 열려 있다(프로메테우스 스크레이프). env·configprops는
        # 값이 마스킹되더라도 설정 키 전체를 드러내므로 노출하지 않는다.
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      # /actuator/**는 인증 없이 열려 있고 8080이 호스트에 퍼블리시된다. always면 DB·Redis
      # 컴포넌트 상태와 디스크 여유 용량이 무인증으로 노출된다.
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.memory.used: true
        process.cpu.usage: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        jvm.memory.used: 0.5,0.95,0.99
        process.cpu.usage: 0.5,0.95,0.99

# KIS API 설정
kis:
  api:
    url: "https://openapi.koreainvestment.com:9443"
    appkey: ${KIS_API_APPKEY}
    appsecret: ${KIS_API_APPSECRET}
  api-app-key: ${KIS_API_APPKEY:}

# Python 분석 서버 설정
python:
  analysis:
    url: ${PYTHON_ANALYSIS_URL}

# Gemini API 설정
gemini:
  api:
    api-key: ${GEMINI_API_KEY}
    model-name: ${GEMINI_API_MODEL_NAME:models/gemini-2.5-flash}
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  admin-key: ${KAKAO_ADMIN_KEY:}

# Firebase 설정
firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    # allowCredentials(true)와 와일드카드 오리진은 함께 쓸 수 없다 — 도메인을 명시한다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  admin:
    # 관리자 API(/api/admin/**, /api/batch-jobs/**) 허용 이메일. 쉼표로 구분한다.
    # 비어 있으면 아무도 통과하지 못한다(fail-closed).
    emails: ${APP_ADMIN_EMAILS:}
