# prod: EC2 한 대 배포(docker-compose.prod.yml). DB 호스트는 반드시 환경 변수로 지정
spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway 는 꺼져 있고 기준 스키마 마이그레이션이 없어, 빈 DB 의 테이블은 엔티티로 만든다.
      ddl-auto: update
    # 테이블이 생긴 뒤에 아래 sql.init 스크립트가 돌게 한다.
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  # 엔티티로 표현되지 않는 인덱스(V2 랭킹, V10 체결 부분 인덱스)와 미션·칭호 기초 데이터.
  # 모두 IF NOT EXISTS / ON CONFLICT 라 기동할 때마다 다시 돌아도 안전하다.
  sql:
    init:
      mode: always
      data-locations:
        - classpath:db/migration/V2__add_ranking_indexes.sql
        - classpath:db/migration/V10__add_orderbook_index.sql
        - classpath:data.sql
