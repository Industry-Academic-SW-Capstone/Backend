# 부가 서비스로 따로 띄울 때 더해지는 설정(ExtraApplication 이 프로필 extra 를 켠다).
spring:
  application:
    name: stockit-extra
  jpa:
    properties:
      hibernate:
        # 엔티티 표를 이 schema 에서 찾는다(ddl-auto validate/update 포함). 이름만 쓴 SQL 은 search_path 로 같은 곳에 간다.
        default_schema: extra
server:
  port: ${SERVER_PORT:8094}
stockit:
  db:
    search-path: extra
  internal-api:
    enabled: true
