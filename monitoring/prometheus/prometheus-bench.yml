# 벤치마크 분리 구성용 Prometheus 설정
#
# 기본 prometheus.yml은 모든 컨테이너가 한 호스트·한 네트워크에 있다고 보고
# 서비스명(backend, node-exporter)으로 타깃을 잡는다. 인스턴스를 분리하면 그 이름이
# 해석되지 않으므로, 여기서는 사설 IP를 직접 쓴다.
#
# ★ 사용 전 아래 <APP_HOST>를 앱 서버 사설 IP로 치환할 것.
#   postgres-exporter / redis-exporter는 이 호스트(모니터링 서버)에서 함께 돌므로
#   서비스명 그대로 둔다.
#
# 보안 그룹: 모니터링 호스트 → 앱 서버의 8080(actuator), 9100(node-exporter) 허용 필요.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 측정 대상 잡은 5초 간격으로 수집한다. k6 스테이지가 30초~1분 단위라 15초면
# 스테이지당 포인트가 2~4개뿐이라 그래프를 읽을 수 없다.
scrape_configs:
  - job_name: 'spring-boot'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['<APP_HOST>:8080']

  # 앱 서버 호스트 지표. "부하 생성기가 병목이 아니었다"를 증명하는 근거.
  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['<APP_HOST>:9100']

  # 아래 둘은 이 호스트에서 함께 실행되며 RDS·Redis에 원격 접속한다.
  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis-exporter:9121']

# 참고: RDS 호스트 자체의 CPU·디스크 큐 깊이는 node-exporter를 올릴 수 없으므로
# CloudWatch에서 별도로 확인하고 결과에 함께 기록한다.
