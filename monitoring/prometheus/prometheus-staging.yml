# 벤치마크 분리 구성용 Prometheus 설정
#
# 기본 prometheus.yml은 모든 컨테이너가 한 호스트·한 네트워크에 있다고 보고
# 서비스명(backend, node-exporter)으로 타깃을 잡는다. 인스턴스를 분리하면 그 이름이
# 해석되지 않으므로, 여기서는 사설 IP를 직접 쓴다.
#
# 서버마다 서비스 하나(9단계): 시세·거래소·증권사·부가가 각자 앱 서버에 뜬다.
# ★ 사용 전 아래를 사설 IP 로 치환할 것.
#     <MARKET_HOST> <EXCHANGE_HOST> <BROKER_HOST> <EXTRA_HOST>   앱 서버 4대
#     <KAFKA_HOST>                                               Kafka·Redis 서버
#   한 서버에 네 서비스를 다 띄우면(8단계 구성) 네 자리에 같은 IP 를 넣으면 된다 — 관리 포트가 서비스마다 달라 겹치지 않는다.
#   node-exporter 는 서버마다 9100 이라 그때는 한 줄만 남긴다.
#   postgres-exporter(RDS 마다 하나) / redis-exporter 는 이 호스트(모니터링 서버)에서 함께 돌므로 서비스명 그대로 둔다.
#
# 보안 그룹: 모니터링 호스트 → 앱 서버의 9091~9094(액추에이터), 9100(node-exporter) 허용 필요.
#   Kafka 서버의 9308(kafka-exporter), 9100(node-exporter) 도 허용.
#   8080(서비스 입구)은 스크레이프에 쓰지 않는다 — 액추에이터를 별도 커넥터로 분리했다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 측정 대상 잡은 5초 간격으로 수집한다. k6 스테이지가 30초~1분 단위라 15초면
# 스테이지당 포인트가 2~4개뿐이라 그래프를 읽을 수 없다.
scrape_configs:
  - job_name: 'spring-boot'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    # 8080 이 아니라 관리 포트다. 부하가 톰캣 워커를 다 써도 스크레이프가 굶지 않는다.
    # 서비스마다 관리 포트가 따로다 — docker-compose.staging-app.yml 의 9091~9094. service 라벨로 서비스별로 나눠 본다.
    # 대시보드의 job="spring-boot" 합계는 네 서비스를 더한 값이라 예전(단일 backend)과 같은 모양이다.
    static_configs:
      - targets: ['<MARKET_HOST>:9091']
        labels: {service: market}
      - targets: ['<EXCHANGE_HOST>:9092']
        labels: {service: exchange}
      - targets: ['<BROKER_HOST>:9093']
        labels: {service: broker}
      - targets: ['<EXTRA_HOST>:9094']
        labels: {service: extra}

  # 앱 서버 호스트 지표. 서버마다 서비스 하나라 service 라벨로 "어느 서비스 서버가 CPU 천장인가"를 본다.
  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['<MARKET_HOST>:9100']
        labels: {service: market}
      - targets: ['<EXCHANGE_HOST>:9100']
        labels: {service: exchange}
      - targets: ['<BROKER_HOST>:9100']
        labels: {service: broker}
      - targets: ['<EXTRA_HOST>:9100']
        labels: {service: extra}

  # 컨슈머 그룹 lag(matching-fill·settlement·market·mission·notification·broker)과 DLT 토픽 offset. 컨슈머가 죽어도 보인다.
  - job_name: 'kafka-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['<KAFKA_HOST>:9308']

  # Kafka 서버 호스트 지표. 측정은 브로커 1대라 브로커가 병목이 아니었음을 회차마다 기록한다.
  # 앱 서버와 같은 node-exporter 지표라 job 으로 구분한다.
  - job_name: 'kafka-node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['<KAFKA_HOST>:9100']

  # 아래는 이 호스트에서 함께 실행되며 RDS·Redis에 원격 접속한다.
  # RDS 가 서비스마다 하나라 exporter 도 셋이다(docker-compose.staging-ops.yml). 시세는 DB 가 없다.
  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter-exchange:9187']
        labels: {service: exchange}
      - targets: ['postgres-exporter-broker:9187']
        labels: {service: broker}
      - targets: ['postgres-exporter-extra:9187']
        labels: {service: extra}

  - job_name: 'redis-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis-exporter:9121']

# 참고: RDS 호스트 자체의 CPU·디스크 큐 깊이는 node-exporter를 올릴 수 없으므로
# CloudWatch에서 별도로 확인하고 결과에 함께 기록한다.
