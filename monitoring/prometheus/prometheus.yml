global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 부하 벤치마크용 수집 설정.
#
# 잡별로 5초 간격을 지정한다. k6 스테이지가 30초~1분 단위라 15초 간격이면 스테이지당
# 데이터 포인트가 2~4개뿐이라 그래프를 읽을 수 없다. 전역 기본값(15s)은 그대로 두어
# 커밋 5a99233(5초→15초 조정)의 결정을 되돌리지 않고, 측정 대상 잡에서만 낮춘다.
scrape_configs:
  - job_name: 'spring-boot'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis 오더북 백엔드 측정용.
  # 이게 없으면 PostgreSQL 쪽은 락·버퍼·트랜잭션까지 보이는데 Redis 쪽은 깜깜해서
  # 두 백엔드 비교가 비대칭이 된다. Redis가 느려도 빨라도 원인을 설명할 수 없다.
  - job_name: 'redis-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis-exporter:9121']
