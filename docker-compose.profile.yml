# 프로파일링 회차 전용 오버라이드
#
#   docker compose -f docker-compose.staging-app.yml -f docker-compose.profile.yml up -d --build
#
# 평소 회차는 -f 를 하나만 주면 된다. 이 파일을 지우거나 안 넘기면 구성이 원래대로 돌아간다.
#
# 두 가지를 바꾼다.
#
# ① 런타임을 JDK 로
#    운영 이미지는 jre-alpine 이라 jcmd·jfr 이 없다. 기록을 부하 구간 60초로 잘라내려면
#    jcmd 가 필요하다. 기동 플래그(StartFlightRecording)로도 뜰 수는 있지만 기동 시점부터
#    담기므로 워밍업·유휴 구간이 섞여 샘플이 희석된다.
#
# ② stackdepth 를 128 로
#    JFR 기본값은 64 인데 Spring 요청 스택(톰캣 → 필터 → 프록시 → 서비스 → Hibernate)이
#    그보다 깊다. 잘릴 때 남는 쪽이 안쪽(말단)이라, 잘리면 정작 호출한 우리 코드가 사라지고
#    "HashMap.get 이 뜨겁다" 같은 쓸모없는 결과만 남는다.
#    이 옵션은 JVM 기동 시에만 정해져 jcmd 로는 바꿀 수 없다.
#
#    JAVA_OPTS 가 아니라 JAVA_TOOL_OPTIONS 인 이유: 전자는 Dockerfile 이 정의한 값을
#    통째로 덮어써 MaxRAMPercentage=75 가 날아간다(힙 3 GiB → 약 1 GiB). 후자는 JVM 이
#    기존 옵션에 덧붙인다.
services:
  backend:
    build:
      args:
        RUNTIME_IMAGE: eclipse-temurin:21-jdk-alpine
    environment:
      - JAVA_TOOL_OPTIONS=-XX:FlightRecorderOptions=stackdepth=128
