# 로컬 개발: PostgreSQL(pgvector) + 백엔드. 운영(docker-compose.prod.yml)과 같은 DB 구성을 쓴다.
# AI 서버까지 띄우려면: docker compose --profile ai up -d  (AI_IMAGE 로 이미지 지정)
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:-stockai}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PYTHON_ANALYSIS_URL: ${PYTHON_ANALYSIS_URL:-http://ai:8000}
    networks:
      - backend
    restart: unless-stopped

  ai:
    image: ${AI_IMAGE:-stockit-ai:local}
    container_name: ai
    profiles:
      - ai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      PGVECTOR_HOST: db
      PGVECTOR_PORT: 5432
      PGVECTOR_USER: stockai
      PGVECTOR_PASSWORD: ${NEWS_DB_PASSWORD:-stockai}
      PGVECTOR_DB: stock_news
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
