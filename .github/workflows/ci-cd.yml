name: CI/CD (toss)

# 토스 배포 전용 브랜치. 기존 운영(main)과 서버·시크릿을 공유하지 않는다(TOSS_* 시크릿).
on:
  push:
    branches: [ toss/main ]
    paths:
      - src/**
      - build.gradle
      - Dockerfile
      - traefik/**
      - postgres/**
      - docker-compose.prod.yml
      - .github/workflows/**
  pull_request:
    branches: [ toss/main ]
  workflow_dispatch:

jobs:
  ci:
    # ubuntu-latest 가 26.04 로 바뀐 뒤 Testcontainers 가 러너의 Docker 에 붙지 못해 통합 테스트가 모두 실패했다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test
        run: chmod +x gradlew && ./gradlew build

  cd:
    if: github.ref == 'refs/heads/toss/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stockit:toss
            ${{ secrets.DOCKER_USERNAME }}/stockit:toss-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TOSS_SERVER_HOST }}
          username: ${{ secrets.TOSS_SERVER_USERNAME }}
          key: ${{ secrets.TOSS_SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,traefik/traefik.yml,postgres/init/10-news-db.sh"
          target: stockit
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TOSS_SERVER_HOST }}
          username: ${{ secrets.TOSS_SERVER_USERNAME }}
          key: ${{ secrets.TOSS_SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/stockit
            # 비밀값은 서버의 .env 하나에서 읽는다(.env.prod.example 참고). 없으면 배포하지 않는다.
            test -f .env || { echo ".env 가 없습니다"; exit 1; }
            chmod +x postgres/init/10-news-db.sh
            mkdir -p traefik/letsencrypt
            touch traefik/letsencrypt/acme.json && chmod 600 traefik/letsencrypt/acme.json
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d
            # 볼륨은 지우지 않는다 — 새 컨테이너가 뜨지 못한 상태에서 지우면 DB 데이터가 사라진다.
            docker image prune -af --filter "until=72h" || true
