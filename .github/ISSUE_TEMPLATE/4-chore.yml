name: 🧭 환경설정
description: 빌드·인프라·설정 등 개발 환경 관련 작업입니다.
title: "[Chore] "
labels: ["🧭 Chore"]
body:
  - type: markdown
    attributes:
      value: |
        환경설정/인프라 작업 이슈입니다. (CI/CD, Docker, 의존성, 모니터링 등)
  - type: textarea
    id: description
    attributes:
      label: 🧭 작업 내용
      description: 무엇을 설정/변경하는지 작성해주세요.
      placeholder: 예) GitHub Actions에 PostgreSQL 모니터링 대시보드 배포 단계를 추가한다.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 🎯 목적
      description: 왜 이 작업이 필요한지 작성해주세요.
    validations:
      required: false
  - type: textarea
    id: todo
    attributes:
      label: 📝 To Do
      value: |
        - [ ]
        - [ ]
    validations:
      required: false
  - type: textarea
    id: reference
    attributes:
      label: ✅ 참고 자료
      description: 참고 레퍼런스, 스크린샷 등이 있다면 첨부해주세요.
    validations:
      required: false
  - type: input
    id: related
    attributes:
      label: 🔗 관련 이슈 / PR
      placeholder: "예) #123"
    validations:
      required: false
