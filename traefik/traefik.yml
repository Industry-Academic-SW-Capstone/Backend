entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

log:
  level: INFO

# 라우팅은 docker-compose.prod.yml 의 컨테이너 라벨이 정한다. 도메인은 .env 의 API_DOMAIN.
providers:
  docker:
    exposedByDefault: false
    network: backend
    endpoint: "unix:///var/run/docker.sock"

certificatesResolvers:
  letsencrypt:
    acme:
      email: ymkim2353@gmail.com
      storage: /etc/traefik/letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
