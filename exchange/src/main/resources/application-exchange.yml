# 거래소 서비스로 따로 띄울 때 더해지는 설정(ExchangeApplication 이 프로필 exchange 를 켠다).
spring:
  application:
    name: stockit-exchange
  jpa:
    properties:
      hibernate:
        # 엔티티 표를 이 schema 에서 찾는다(ddl-auto validate/update 포함). 이름만 쓴 SQL 은 search_path 로 같은 곳에 간다.
        default_schema: exchange
        # ddl-auto update 환경(로컬·스테이징)에서 schema 가 없으면 만든다. 운영(validate)은 V20 이 만든다.
        hbm2ddl:
          create_namespaces: true
server:
  port: ${SERVER_PORT:8092}
stockit:
  db:
    search-path: exchange
  internal-api:
    enabled: true
