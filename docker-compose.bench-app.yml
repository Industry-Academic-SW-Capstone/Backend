# 벤치마크 — 앱 서버 (측정 대상 호스트)
#
# 이 호스트에는 측정 대상과 호스트 지표 수집기만 둔다.
# 부하 생성기(k6)와 모니터링 백엔드(Prometheus/Grafana)는 별도 호스트로 분리한다
# — docker-compose.bench-ops.yml 참고.
#
# 실행: docker compose -f docker-compose.bench-app.yml up -d
#
# 필요한 환경변수 (.env)
#   POSTGRES_URL              jdbc:postgresql://<RDS 엔드포인트>:5432/<db>
#   POSTGRES_USER / _PASSWORD / _DB
#   SPRING_REDIS_HOST         Redis 인스턴스 사설 IP        ← 분리하면서 반드시 바뀜
#   APP_CORS_ALLOWED_ORIGINS  비면 기동 실패(fail-fast)
#   APP_ADMIN_EMAILS          비면 종목 마스터 적재 불가
#   KIS_API_APPKEY / _APPSECRET, JWT_SECRET 등

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_URL=${POSTGRES_URL}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
      - KIS_API_APPKEY=${KIS_API_APPKEY}
      - KIS_API_APPSECRET=${KIS_API_APPSECRET}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - FIREBASE_CREDENTIALS_BASE64=${FIREBASE_CREDENTIALS_BASE64:-}
      - PYTHON_ANALYSIS_URL=${PYTHON_ANALYSIS_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - APP_ADMIN_EMAILS=${APP_ADMIN_EMAILS:-}
      # ── 벤치마크 스위치 ──
      # redis|jpa 조합으로 증분 매트릭스(R0~R3)를 만든다.
      - MATCHING_ORDERBOOK_BACKEND=${MATCHING_ORDERBOOK_BACKEND:-redis}
      - MATCHING_QUEUE_BACKEND=${MATCHING_QUEUE_BACKEND:-redis}
      - MATCHING_LIMIT_ORDER_FETCH_SIZE=${MATCHING_LIMIT_ORDER_FETCH_SIZE:-100}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # 호스트 지표는 그 호스트 위에서만 수집할 수 있으므로 여기 남긴다.
  # 부하 생성기가 병목이 아니었음을 증명하는 근거가 된다(앱 서버 CPU 여유).
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"          # 모니터링 호스트에서 스크레이프한다
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
